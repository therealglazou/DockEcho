# A vX.Y.Z tag (scripts/release.sh) builds DockEcho.app and publishes a GitHub
# release with its archive, which Ronnie installs from its Downloads page.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release:
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: The tag matches the version in build.sh
        run: |
          version=$(sed -n 's#.*CFBundleShortVersionString</key><string>\([^<]*\).*#\1#p' build.sh)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME but build.sh says $version" >&2
            exit 1
          fi

      # Ronnie's self-signed certificate (MACOS_SIGN_P12, base64, and its
      # password): the same signature from one version to the next keeps the
      # Accessibility and Screen Recording permissions. Without the secrets,
      # build.sh signs ad hoc and macOS asks for them again after each update.
      - name: Signing certificate
        env:
          P12: ${{ secrets.MACOS_SIGN_P12 }}
          P12_PASSWORD: ${{ secrets.MACOS_SIGN_P12_PASSWORD }}
        run: |
          if [ -z "$P12" ]; then
            echo "::warning::No MACOS_SIGN_P12 secret: ad-hoc signature"
            exit 0
          fi
          keychain="$RUNNER_TEMP/sign.keychain-db"
          pass=$(openssl rand -hex 16)
          echo "$P12" | base64 --decode >"$RUNNER_TEMP/sign.p12"
          security create-keychain -p "$pass" "$keychain"
          security set-keychain-settings "$keychain"
          security unlock-keychain -p "$pass" "$keychain"
          security import "$RUNNER_TEMP/sign.p12" -k "$keychain" -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -k "$pass" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/sign.p12"
          echo "SIGN_IDENTITY=Ronnie Code Signing" >>"$GITHUB_ENV"

      - name: Package
        run: scripts/package.sh

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "DockEcho ${GITHUB_REF_NAME#v}" --generate-notes
